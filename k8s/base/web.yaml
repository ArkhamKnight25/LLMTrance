apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: llmtrace
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/arkhamknight25/llmtrace-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3233
              name: http
          envFrom:
            - configMapRef:
                name: llmtrace-config
          readinessProbe:
            httpGet:
              path: /
              port: 3233
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: llmtrace
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3233
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: llmtrace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
