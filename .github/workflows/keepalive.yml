name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping api health
        run: |
          URL="${{ secrets.KEEPALIVE_URL }}"
          if [ -z "$URL" ]; then
            echo "KEEPALIVE_URL secret not set; skipping"
            exit 0
          fi
          curl -sS --max-time 30 --retry 2 "$URL" -o /dev/null -w "%{http_code}\n"
