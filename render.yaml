databases:
  - name: llmtrace-postgres
    plan: free
    databaseName: llmtrace
    user: llmtrace
    postgresMajorVersion: 16

services:
  - type: web
    name: llmtrace-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3232"
      - key: DATABASE_URL
        fromDatabase:
          name: llmtrace-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INGESTION_API_KEY
        generateValue: true
      - key: INGEST_URL
        sync: false

  - type: worker
    name: llmtrace-worker
    runtime: docker
    plan: free
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: llmtrace-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: "8"
